[project]
name = "ng-automate"
version = "0.1.0"
description = "Agent system that analyzes, builds, generates and runs test-automation projects"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "openhands-sdk>=1.53.0",
    "openhands-tools>=1.53.0",
    "openhands-workspace>=1.53.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Run from source like QXcel (`python main.py`); the `app` package is not installed.
package = false

[tool.uv.sources]
openhands-sdk = { path = "third_party/software-agent-sdk/openhands-sdk", editable = true }
openhands-tools = { path = "third_party/software-agent-sdk/openhands-tools", editable = true }
openhands-workspace = { path = "third_party/software-agent-sdk/openhands-workspace", editable = true }
langgraph = { path = "third_party/langgraph/libs/langgraph", editable = true }
langgraph-checkpoint = { path = "third_party/langgraph/libs/checkpoint", editable = true }
langgraph-prebuilt = { path = "third_party/langgraph/libs/prebuilt", editable = true }
langgraph-sdk = { path = "third_party/langgraph/libs/sdk-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Models like TestCaseStatus / TestRunResultModel are not test classes.
filterwarnings = ["ignore:cannot collect test class:pytest.PytestCollectionWarning"]
markers = [
    "network: needs internet access (clones a public GitHub repository)",
    "docker: starts real Docker containers (set NGAUTOMATE_DOCKER_TESTS=1 to run)",
    "e2e: needs Docker and a reachable LLM (set NGAUTOMATE_E2E_TESTS=1 to run)",
]
