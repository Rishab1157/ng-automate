[project]
name = "ng-automate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "openhands-sdk>=1.53.0",
    "openhands-tools>=1.53.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ng-automate = "ng_automate:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
openhands-sdk = { path = "third_party/software-agent-sdk/openhands-sdk", editable = true }
openhands-tools = { path = "third_party/software-agent-sdk/openhands-tools", editable = true }
